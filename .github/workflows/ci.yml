name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (the version this Mac builds with)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # "debug+release": the Linux job builds both, and a cache whose key already exists is never saved again.
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-debug+release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-
      - name: Format, Clippy with warnings as errors, tests, docs without broken links
        run: make check
      - uses: actions/setup-python@v6
        if: runner.os == 'Linux'
        with:
          python-version: "3.11"
      - name: Differential test against DuckDB 2.0.0 (the TPC-H queries and 1,000 random ones, at scale 0.01)
        if: runner.os == 'Linux'
        run: |
          pip install duckdb==2.0.0
          cargo build --release --locked -p quarry-cli -p quarry-tpch
          ./target/release/tpch-gen 0.01 data/tpch-0.01
          python -I scripts/differential.py target/release/quarry data/tpch-0.01 --random 1000 --seed 1
      - name: The property tests (binder, evaluator, GROUP BY and ORDER BY, joins, pruning, whole queries optimized) at 100,000 cases each (release build)
        if: runner.os == 'Linux'
        run: >-
          cargo test --release --locked -p quarry
          --test binder_properties --test eval_properties --test query_properties --test join_properties --test pruning --test optimizer_properties
        env:
          PROPTEST_CASES: "100000"
